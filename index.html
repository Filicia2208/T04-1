<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">

	<title>T04 – SVG House &amp; Garden</title>
	<style>
		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f3f6ef;
			font-family: Georgia, "Times New Roman", serif;
		}

		main { width: min(100%, 900px); }

		svg {
			display: block;
			width: 100%;
			height: auto;
			border: 2px solid #526b4c;
			border-radius: 8px;
			background: #d9eff5;
			box-shadow: 0 8px 24px rgb(47 67 43 / 12%);
		}

		#scene-original,
		#scene-annotated-figure {
			margin: 0 0 24px;
		}

		#scene-original figcaption,
		#scene-annotated-figure figcaption {
			margin-top: 8px;
			color: #38523a;
			text-align: center;
		}

		#scene-annotated #annotations {
			font-family: sans-serif;
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
			pointer-events: none;
		}

		#scene-annotated #annotations text {
			fill: #333;
			stroke: none;
		}

		#scene-annotated #annotations line {
			fill: none;
			stroke: #666;
			stroke-width: 1;
		}

		#scene-adjusted-figure {
			margin: 0 0 24px;
		}

		#scene-adjusted-figure figcaption {
			margin-top: 8px;
			color: #38523a;
			text-align: center;
		}

		/* Darker outlines sharpen the house and foliage; fence dashes stay local. */
		#scene-adjusted .tree-trunk {
			fill: #68452e;
			stroke: #493321;
			stroke-width: 2;
		}

		#scene-adjusted .tree-canopy {
			stroke: #245936;
			stroke-width: 2;
		}

		#scene-adjusted .house-wall {
			fill: #fff0cf;
			stroke: #59402f;
			stroke-width: 4;
		}

		#scene-adjusted .house-trim {
			stroke: #503628;
			stroke-width: 4;
		}

		#scene-adjusted .house-window {
			stroke: #49382d;
			stroke-width: 5;
		}

		#scene-adjusted .adjusted-fence {
			stroke: #fffdf1;
			stroke-width: 5;
			stroke-dasharray: 9 6;
		}

		#scene-adjusted .stone-path {
			fill: #cec5ae;
			stroke: #736d60;
			stroke-width: 2;
		}

		#scene-adjusted .stone-joints {
			fill: none;
			stroke: #958b76;
			stroke-width: 2;
		}

		#scene-grouped-figure {
			margin: 0 0 24px;
		}

		#scene-grouped-figure figcaption {
			margin-top: 8px;
			color: #38523a;
			text-align: center;
		}
	</style>
</head>
