<!doctype html>
<html lang="en">
<head>

	<title>T04 – SVG House &amp; Garden</title>
	<style>
		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f3f6ef;
			font-family: Georgia, "Times New Roman", serif;
		}

		main { width: min(100%, 900px); }

		svg {
			display: block;
			width: 100%;
			height: auto;
			border: 2px solid #526b4c;
			border-radius: 8px;
			background: #d9eff5;
			box-shadow: 0 8px 24px rgb(47 67 43 / 12%);
		}

		#scene-original,
		#scene-annotated-figure {
			margin: 0 0 24px;
		}

		#scene-original figcaption,
		#scene-annotated-figure figcaption {
			margin-top: 8px;
			color: #38523a;
			text-align: center;
		}

		#scene-annotated #annotations {
			font-family: sans-serif;
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
			pointer-events: none;
		}

		#scene-annotated #annotations text {
			fill: #333;
			stroke: none;
		}

		#scene-annotated #annotations line {
			fill: none;
			stroke: #666;
			stroke-width: 1;
		}
	</style>
</head>
