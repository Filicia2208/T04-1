<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>T04 – SVG House &amp; Garden</title>
	<style>
		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f3f6ef;
			font-family: Georgia, "Times New Roman", serif;
		}

		main { width: min(100%, 900px); }

		svg {
			display: block;
			width: 100%;
			height: auto;
			border: 2px solid #526b4c;
			border-radius: 8px;
			background: #d9eff5;
			box-shadow: 0 8px 24px rgb(47 67 43 / 12%);
		}
	</style>
</head>
<body>
	<main>
		<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
			<title id="scene-title">T04 – SVG House &amp; Garden</title>
			<desc id="scene-desc">A sunny country garden with a white cloud, leafy tree, red-roofed house, fence, flowers, and a winding path through green grass.</desc>

			<!-- Sky and lawn -->
			<rect x="0" y="0" width="800" height="320" fill="#bfe7f1" />
			<rect x="0" y="320" width="800" height="180" fill="#8fbd68" />

			<!-- Sun and cloud -->
			<circle cx="690" cy="82" r="42" fill="#ffd45c" />
			<ellipse cx="160" cy="94" rx="48" ry="24" fill="#fff" />
			<circle cx="137" cy="84" r="22" fill="#fff" />
			<circle cx="166" cy="74" r="29" fill="#fff" />
			<circle cx="190" cy="88" r="20" fill="#fff" />

			<!-- Tree -->
			<rect x="105" y="238" width="34" height="112" rx="5" fill="#855333" />
			<circle cx="122" cy="205" r="52" fill="#4f8e52" />
			<circle cx="88" cy="225" r="31" fill="#68a85c" />
			<circle cx="154" cy="225" r="34" fill="#5c9a54" />

			<!-- House body, chimney, and roof -->
			<rect x="291" y="222" width="276" height="176" fill="#f5dfb7" stroke="#7d563f" stroke-width="3" />
			<rect x="488" y="143" width="42" height="80" fill="#a95645" stroke="#704638" stroke-width="3" />
			<polygon points="266,230 429,117 592,230" fill="#b64e43" stroke="#704638" stroke-width="4" stroke-linejoin="round" />

			<!-- Door and two windows -->
			<rect x="397" y="300" width="66" height="98" fill="#80513a" stroke="#603f30" stroke-width="3" />
			<circle cx="450" cy="350" r="4" fill="#f5d36b" />
			<rect x="319" y="260" width="54" height="52" fill="#a8dbe7" stroke="#80513a" stroke-width="4" />
			<line x1="346" y1="260" x2="346" y2="312" stroke="#80513a" stroke-width="3" />
			<line x1="319" y1="286" x2="373" y2="286" stroke="#80513a" stroke-width="3" />
			<rect x="485" y="260" width="54" height="52" fill="#a8dbe7" stroke="#80513a" stroke-width="4" />
			<line x1="512" y1="260" x2="512" y2="312" stroke="#80513a" stroke-width="3" />
			<line x1="485" y1="286" x2="539" y2="286" stroke="#80513a" stroke-width="3" />

			<!-- Winding garden path -->
			<path d="M 423 398 C 427 425, 486 431, 469 500 L 321 500 C 354 457, 375 431, 370 398 Z" fill="#d9c49a" />

			<!-- Fence across the garden -->
			<polyline points="0,358 0,335 24,335 24,358 48,358 48,335 72,335 72,358 96,358 96,335 120,335 120,358 144,358 144,335 168,335 168,358 192,358 192,335 216,335 216,358 240,358 240,335 264,335 264,358 288,358 288,335 312,335 312,358 336,358" fill="none" stroke="#f4ead3" stroke-width="7" stroke-linejoin="round" />
			<line x1="0" y1="344" x2="336" y2="344" stroke="#f4ead3" stroke-width="5" />

			<!-- Flowers -->
			<line x1="625" y1="403" x2="625" y2="446" stroke="#447b42" stroke-width="4" />
			<circle cx="625" cy="398" r="8" fill="#e66b79" />
			<circle cx="615" cy="398" r="6" fill="#f28a91" />
			<circle cx="635" cy="398" r="6" fill="#f28a91" />
			<circle cx="625" cy="388" r="6" fill="#f28a91" />
			<circle cx="625" cy="408" r="6" fill="#f28a91" />
			<circle cx="625" cy="398" r="4" fill="#ffd45c" />
			<line x1="678" y1="416" x2="678" y2="454" stroke="#447b42" stroke-width="4" />
			<circle cx="678" cy="411" r="7" fill="#f1a340" />
			<circle cx="669" cy="411" r="5" fill="#ffd45c" />
			<circle cx="687" cy="411" r="5" fill="#ffd45c" />
			<circle cx="678" cy="402" r="5" fill="#ffd45c" />
			<circle cx="678" cy="420" r="5" fill="#ffd45c" />
			<circle cx="678" cy="411" r="3" fill="#8e643e" />

			<text x="400" y="477" text-anchor="middle" fill="#38523a" font-size="20">Home in the garden</text>
		</svg>
	</main>
</body>
</html>
